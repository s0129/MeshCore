[sv_lr1110]
extends = nrf52_base
board = sv_lr1110
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
build_flags = ${nrf52_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/sv_lr1110
  -D RADIO_CLASS=CustomLR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D LORA_TX_POWER=22
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=BUTTON_PIN
  -D PIN_STATUS_LED=PIN_LED1
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/sv_lr1110/target.cpp>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit SSD1306 @ ^2.5.13
  stevemarple/MicroNMEA @ ^2.0.6

[sv_lr1110_companion]
extends = sv_lr1110
build_flags = ${sv_lr1110.build_flags}
  -I examples/companion_radio/ui-orig
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${sv_lr1110.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${sv_lr1110.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:sv_lr1110_companion_radio_usb]
extends = sv_lr1110_companion
build_flags = ${sv_lr1110_companion.build_flags}
  -D ENABLE_USB_INTERFACE

[env:sv_lr1110_companion_radio_ble]
extends = sv_lr1110_companion
build_flags = ${sv_lr1110_companion.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${sv_lr1110_companion.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>

[env:sv_lr1110_repeater]
extends = sv_lr1110
build_flags = ${sv_lr1110.build_flags}
  -D ADVERT_NAME='"SV LR1110 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${sv_lr1110.build_src_filter}
  +<../examples/simple_repeater>

[env:sv_lr1110_room_server]
extends = sv_lr1110
build_flags = ${sv_lr1110.build_flags}
  -D ADVERT_NAME='"SV LR1110 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${sv_lr1110.build_src_filter}
  +<../examples/simple_room_server>
